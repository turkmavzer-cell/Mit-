<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<title>MİT - Müşteri &amp; İmalat İş Takip Asistanı</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overscroll-behavior-y: contain; }
body {
  background: #111827; color: #f3f4f6;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
button, input, textarea { font-family: inherit; }
button { cursor: pointer; }

.mit-shell { min-height: 100vh; padding-bottom: 64px; display: flex; flex-direction: column; }
.mit-hidden { display: none !important; }
.mit-muted { color: #6b7280; }
.mit-muted-sm { font-size: 13px; color: #9ca3af; margin: 0; }
.mit-accent { color: #2dd4bf; }
.mit-emerald { color: #34d399; }
.mit-spin { animation: mit-spin 1s linear infinite; }
@keyframes mit-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* Splash */
.mit-splash { position: fixed; inset: 0; z-index: 300; background: #111827; }
.mit-splash-image img { width: 100%; height: 100%; object-fit: cover; }
.mit-splash-logo { display: flex; align-items: center; justify-content: center; }
.mit-splash-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; animation: mit-fade .4s ease-out; }
.mit-splash-logo-img { width: 128px; height: 128px; object-fit: contain; }
.mit-splash-title { font-size: 24px; font-weight: 700; margin: 0; color: #f3f4f6; }
.mit-splash-sub { font-size: 14px; color: #6b7280; margin: 4px 0 0; }
@keyframes mit-fade { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

/* Header */
.mit-header {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px;
  background: rgba(17,24,39,.95); backdrop-filter: blur(6px);
  border-bottom: 1px solid #1f2937; padding: 12px; min-height: 56px;
}
.mit-header-logo { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
.mit-header-title { flex: 1; font-size: 18px; font-weight: 600; color: #f3f4f6; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mit-header-actions { display: flex; gap: 2px; }

.mit-icon-btn {
  min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;
  border-radius: 999px; background: transparent; border: none; color: #d1d5db;
}
.mit-icon-btn:active { background: #1f2937; }
.mit-icon-sm { min-width: 32px; min-height: 32px; }
.mit-icon-round { background: #374151; }
.mit-icon-round:active { background: #4b5563; }
.mit-icon-accent { color: #2dd4bf; }
.mit-icon-danger { color: #f87171; }

/* Body / list */
.mit-body { flex: 1; padding: 12px 16px 16px; }
.mit-list { display: flex; flex-direction: column; gap: 8px; }
.mit-empty { text-align: center; color: #6b7280; font-size: 13px; margin-top: 40px; }
.mit-empty-inline { font-size: 13px; color: #6b7280; font-style: italic; margin: 0; }
.mit-card {
  background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 14px;
  text-align: left; width: 100%; color: inherit;
}

/* Bottom nav */
.mit-bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
  background: rgba(17,24,39,.95); backdrop-filter: blur(6px); border-top: 1px solid #1f2937;
  padding-bottom: env(safe-area-inset-bottom);
}
.mit-nav-btn {
  flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; background: none; border: none; color: #6b7280;
}
.mit-nav-btn span { font-size: 11px; font-weight: 500; }
.mit-nav-active { color: #2dd4bf; }

/* Summary card (Home) */
.mit-summary-card {
  background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 14px;
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
}
.mit-summary-left { display: flex; align-items: center; gap: 10px; }
.mit-summary-icon { border-radius: 999px; background: #042f2e; border: 1px solid #0d9488; padding: 8px; display: flex; }
.mit-summary-label { font-size: 12px; color: #9ca3af; margin: 0; }
.mit-summary-value { font-size: 18px; font-weight: 700; color: #f3f4f6; margin: 0; }
.mit-segment { display: flex; border-radius: 8px; background: #111827; border: 1px solid #374151; overflow: hidden; }
.mit-segment-btn { padding: 8px 12px; min-height: 36px; font-size: 12px; font-weight: 500; background: none; border: none; color: #9ca3af; }
.mit-segment-active { background: #14b8a6; color: #fff; }

/* Search */
.mit-search-wrap { position: relative; margin-bottom: 8px; }
.mit-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280; display: flex; }
.mit-search-input { padding-left: 38px !important; }
.mit-row-flex { display: flex; gap: 8px; align-items: flex-start; }
.mit-flex-1 { flex: 1; }

.mit-input {
  width: 100%; min-height: 44px; border-radius: 12px; background: #1f2937; border: 1px solid #374151;
  padding: 0 12px; color: #f3f4f6; font-size: 15px; outline: none;
}
.mit-input:focus { border-color: #14b8a6; }
.mit-textarea { padding: 10px 12px; resize: none; min-height: auto; }
.mit-field-empty { border-color: rgba(217,179,6,.6) !important; box-shadow: 0 0 0 1px rgba(217,179,6,.25); }

/* Sort */
.mit-sort-wrap { position: relative; }
.mit-sort-menu {
  position: absolute; right: 0; top: 48px; width: 220px; background: #1f2937; border: 1px solid #374151;
  border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,.4); overflow: hidden; z-index: 40;
}
.mit-sort-item { display: block; width: 100%; text-align: left; padding: 10px 16px; font-size: 13px; background: none; border: none; color: #d1d5db; }
.mit-sort-item:active { background: #374151; }
.mit-sort-item-active { color: #2dd4bf; font-weight: 500; }

/* Customer list/card */
.mit-customer-card { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mit-customer-info { min-width: 0; }
.mit-customer-name { font-weight: 600; font-size: 14px; margin: 0; color: #f3f4f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mit-customer-address { font-size: 12px; color: #6b7280; margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mit-customer-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.mit-customer-total { font-size: 12px; color: #6b7280; }

/* Badges */
.mit-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.mit-badge-amber { background: #451a03; color: #fcd34d; border-color: rgba(217,119,6,.5); }
.mit-badge-emerald { background: #022c22; color: #6ee7b7; border-color: rgba(5,150,105,.6); }

/* Job cards */
.mit-job-card { display: block; }
.mit-job-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.mit-job-info-col { min-width: 0; }
.mit-job-name { font-weight: 600; font-size: 14px; margin: 0; color: #f3f4f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mit-job-customer { font-size: 13px; font-weight: 500; color: #5eead4; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mit-job-customer-top { font-size: 19.5px; font-weight: 700; margin: 0 0 2px; }
.mit-job-fabric { font-size: 12px; color: #6b7280; margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mit-job-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.mit-job-total { font-size: 12px; color: #6b7280; margin: 8px 0 0; }

/* Detail screen */
.mit-detail-contact { padding: 0 0 10px; }
.mit-contact-line { font-size: 13px; color: #9ca3af; margin: 0 0 3px; display: flex; align-items: center; gap: 6px; }
.mit-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.mit-tab { flex: 1; min-height: 40px; border-radius: 12px; font-size: 13px; font-weight: 500; background: #1f2937; border: 1px solid #374151; color: #9ca3af; }
.mit-tab-active-amber { background: #451a03; color: #fcd34d; border-color: rgba(217,119,6,.5); }
.mit-tab-active-emerald { background: #022c22; color: #6ee7b7; border-color: rgba(5,150,105,.6); }
.mit-fab {
  position: fixed; bottom: 84px; right: 20px; z-index: 20; min-width: 56px; min-height: 56px;
  border-radius: 999px; background: #14b8a6; color: #fff; border: none; box-shadow: 0 10px 20px rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center;
}
.mit-fab:active { background: #0d9488; }

/* Buttons */
.mit-btn { min-height: 44px; border-radius: 12px; font-weight: 600; font-size: 14px; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; }
.mit-btn-block { width: 100%; }
.mit-btn-flex1 { flex: 1; }
.mit-btn-sm { min-height: 36px; font-size: 12px; padding: 0 10px; }
.mit-btn-primary { background: #14b8a6; color: #fff; }
.mit-btn-primary:active { background: #0d9488; }
.mit-btn-primary:disabled { background: #134e4a; color: rgba(45,212,191,.5); }
.mit-btn-secondary { background: #374151; color: #f3f4f6; }
.mit-btn-secondary:active { background: #4b5563; }
.mit-btn-danger { background: #dc2626; color: #fff; }
.mit-btn-danger:active { background: #b91c1c; }
.mit-btn-danger:disabled { background: #7f1d1d; color: rgba(248,113,113,.5); }
.mit-btn-danger-soft { background: #450a0a; color: #fca5a5; border: 1px solid rgba(153,27,27,.6); }
.mit-btn-amber-soft { background: #451a03; color: #fcd34d; border: 1px solid rgba(217,119,6,.5); }
.mit-btn-emerald-soft { background: #022c22; color: #6ee7b7; border: 1px solid rgba(5,150,105,.6); }
.mit-link-btn { background: none; border: none; color: #2dd4bf; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 4px; }

/* Modal overlay/sheet */
.mit-modal-overlay {
  position: fixed; inset: 0; z-index: 150; background: rgba(0,0,0,.7);
  display: flex; align-items: flex-end; justify-content: center;
}
.mit-modal-sheet {
  width: 100%; max-height: 92vh; background: #1f2937; border: 1px solid #374151;
  border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; overflow: hidden;
}
@media (min-width: 640px) {
  .mit-modal-overlay { align-items: center; padding: 16px; }
  .mit-modal-sheet { max-width: 480px; border-radius: 20px; }
  .mit-modal-wide { max-width: 560px; }
}
.mit-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #374151; }
.mit-modal-header h3 { margin: 0; font-size: 16px; font-weight: 600; color: #f3f4f6; }
.mit-modal-content { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.mit-modal-content-tight { padding: 16px 16px 0; }
.mit-modal-footer { padding: 16px; border-top: 1px solid #374151; }
.mit-footer-split { display: flex; gap: 8px; }

.mit-field { display: flex; flex-direction: column; gap: 4px; }
.mit-label { font-size: 12px; font-weight: 500; color: #9ca3af; }
.mit-required { color: #f87171; }
.mit-field-error { font-size: 12px; color: #fbbf24; margin: 2px 0 0; }
.mit-hint { font-size: 11px; color: #6b7280; margin: 2px 0 0; display: flex; align-items: center; gap: 4px; }
.mit-hint-block { display: block; }
.mit-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mit-row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mit-mt-sm { margin-top: 8px; }

/* Roll (kumaş topu) UI */
.mit-roll-unit-row { display: flex; gap: 8px; margin-bottom: 8px; }
.mit-unit-btn { flex: 1; min-height: 44px; border-radius: 12px; font-weight: 600; font-size: 13px; background: #1f2937; border: 1px solid #374151; color: #9ca3af; }
.mit-unit-mt-active { background: #042f2e; border-color: #14b8a6; color: #5eead4; }
.mit-unit-kg-active { background: #451a03; border-color: #f59e0b; color: #fcd34d; }
.mit-roll-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
.mit-roll-input { flex: 1; min-width: 0; font-size: 16px; }
.mit-roll-add-btn { flex-shrink: 0; min-width: 52px; padding: 0; }
.mit-roll-group-label { font-size: 12px; font-weight: 500; color: #6b7280; margin: 0 0 6px; }
.mit-roll-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; margin-bottom: 10px; }
.mit-roll-chip { border-radius: 8px; padding: 6px 8px; display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 13px; font-weight: 500; border: 1px solid; user-select: none; }
.mit-chip-mt { color: #5eead4; background: rgba(13,148,136,.15); border-color: rgba(20,184,166,.5); }
.mit-chip-kg { color: #fcd34d; background: rgba(180,83,9,.15); border-color: rgba(245,158,11,.5); }
.mit-chip-selected { outline: 2px solid #2dd4bf; }
.mit-chip-x { background: none; border: none; color: inherit; padding: 2px; display: flex; min-height: auto; }
.mit-roll-chip-editing { padding: 4px 6px; }
.mit-chip-edit-input { width: 100%; background: transparent; border: none; outline: none; color: inherit; font-size: 13px; font-weight: 500; }
.mit-roll-totals { background: rgba(31,41,55,.6); border: 1px solid #374151; border-radius: 12px; padding: 10px; font-size: 13px; }
.mit-roll-total-row { display: flex; justify-content: space-between; padding: 2px 0; color: #d1d5db; }
.mit-roll-total-mt { color: #2dd4bf; font-weight: 500; }
.mit-roll-total-kg { color: #f59e0b; font-weight: 500; }
.mit-roll-total-grand { border-top: 1px solid #374151; margin-top: 4px; padding-top: 6px; font-weight: 600; color: #f3f4f6; }

/* Pattern group card */
.mit-pattern-group-card { border-radius: 12px; border: 1px solid #374151; background: rgba(17,24,39,.6); overflow: hidden; margin-bottom: 6px; }
.mit-pattern-group-top { display: flex; align-items: center; gap: 4px; padding: 8px 10px; }
.mit-pattern-group-name-btn { flex: 1; min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; background: none; border: none; color: #f3f4f6; font-size: 13px; font-weight: 500; text-align: left; min-width: 0; }
.mit-pattern-group-name-btn:active { background: #1f2937; }
.mit-pattern-group-total { flex-shrink: 0; font-size: 12px; font-weight: 500; color: #2dd4bf; white-space: nowrap; }
.mit-pattern-group-body { padding: 0 10px 10px; }
.mit-grand-total { margin-top: 10px; border-radius: 12px; background: rgba(13,148,136,.15); border: 1px solid rgba(13,148,136,.5); padding: 12px; }
.mit-grand-total-value { font-size: 18px; font-weight: 700; color: #5eead4; }
.mit-grand-total-sub { font-size: 11px; color: rgba(94,234,212,.7); margin: 4px 0 0; }

/* Photos */
.mit-photo-btn-row { display: flex; gap: 8px; }
.mit-photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.mit-photo-tile { position: relative; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; }
.mit-photo-tile img { width: 100%; height: 100%; object-fit: cover; }

/* Tile action buttons (shared: photo delete, pattern edit/delete) */
.mit-tile-action { position: absolute; top: 4px; min-width: 24px; min-height: 24px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; border: none; display: flex; align-items: center; justify-content: center; }
.mit-tile-action-left { left: 4px; }
.mit-tile-action-right { right: 4px; }

/* Pattern library / picker */
.mit-settings-stat { padding: 14px; }
.mit-settings-block { padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.mit-block-title { margin: 0; font-size: 14px; font-weight: 600; color: #f3f4f6; display: flex; align-items: center; gap: 6px; }
.mit-block-desc { margin: 0; font-size: 12px; color: #6b7280; display: flex; align-items: flex-start; gap: 4px; }
.mit-nav-row { display: flex; align-items: center; justify-content: space-between; padding: 14px; }
.mit-nav-row-left { display: flex; align-items: center; gap: 8px; }
.mit-nav-row-title { display: block; font-size: 14px; font-weight: 600; color: #f3f4f6; }
.mit-nav-row-sub { display: block; font-size: 12px; color: #6b7280; }
.mit-section-label { margin: 0 0 8px; }

.mit-pattern-form-row { display: flex; gap: 12px; }
.mit-photo-pick { flex-shrink: 0; width: 80px; height: 80px; border-radius: 12px; background: #111827; border: 1px solid #374151; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 0; }
.mit-photo-pick img { width: 100%; height: 100%; object-fit: cover; }
.mit-pattern-form-fields { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mit-pattern-form-btns { display: flex; gap: 8px; }
.mit-pattern-form-actions { display: flex; gap: 8px; }

.mit-pattern-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.mit-pattern-tile { position: relative; }
.mit-pattern-tile-img { aspect-ratio: 1/1; border-radius: 12px; background: #1f2937; border: 1px solid #374151; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.mit-pattern-tile-img img { width: 100%; height: 100%; object-fit: cover; }
.mit-pattern-tile-name { font-size: 12px; color: #d1d5db; margin: 4px 0 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mit-pattern-pick-tile { background: none; border: none; padding: 0; text-align: left; }
.mit-pattern-pick-tile .mit-pattern-tile-img { border: 1px solid #374151; }
.mit-pattern-pick-tile:active .mit-pattern-tile-img { border-color: #14b8a6; }

.mit-list-item { width: 100%; min-height: 44px; border-radius: 12px; background: #111827; border: 1px solid #374151; padding: 0 16px; display: flex; align-items: center; gap: 8px; color: #f3f4f6; font-size: 14px; margin-bottom: 6px; }
.mit-list-item-accent { background: #042f2e; border-color: rgba(13,148,136,.5); color: #5eead4; font-weight: 500; }

/* Confirmation modal */
.mit-confirm-sheet { padding: 20px; border-radius: 20px; align-self: center; }
.mit-confirm-top { display: flex; gap: 12px; margin-bottom: 12px; }
.mit-confirm-icon { flex-shrink: 0; border-radius: 999px; background: #451a03; border: 1px solid rgba(217,119,6,.5); padding: 8px; display: flex; align-items: center; justify-content: center; color: #fbbf24; }
.mit-confirm-title { margin: 0; font-size: 15px; font-weight: 600; color: #f3f4f6; }
.mit-confirm-msg { margin: 4px 0 0; font-size: 13px; color: #9ca3af; }
.mit-confirm-actions { display: flex; gap: 8px; margin-top: 6px; }
.mit-confirm-actions .mit-btn { flex: 1; }

/* Toast */
.mit-toast-root { position: fixed; bottom: 80px; left: 0; right: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; pointer-events: none; }
.mit-toast { border-radius: 12px; padding: 10px 16px; font-size: 13px; font-weight: 500; max-width: 380px; width: 100%; box-shadow: 0 8px 20px rgba(0,0,0,.35); pointer-events: auto; }
.mit-toast-success { background: #022c22; color: #6ee7b7; border: 1px solid rgba(5,150,105,.5); }
.mit-toast-error { background: #450a0a; color: #fca5a5; border: 1px solid rgba(153,27,27,.5); }
.mit-toast-info { background: #042f2e; color: #5eead4; border: 1px solid rgba(13,148,136,.5); }
.mit-toast-undo { background: #1f2937; border: 1px solid #4b5563; color: #d1d5db; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mit-toast-undo-btn { background: none; border: none; color: #2dd4bf; font-weight: 600; display: flex; align-items: center; gap: 4px; min-height: 32px; }

/* Lightbox */
.mit-lightbox-overlay { background: rgba(0,0,0,.95); align-items: center; }
.mit-lightbox { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.mit-lightbox-img { max-width: 100%; max-height: 100%; object-fit: contain; }
.mit-lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,.4); color: #fff; z-index: 5; }
.mit-lightbox-prev { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.4); color: #fff; }
.mit-lightbox-next { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.4); color: #fff; }
.mit-lightbox-counter { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.4); color: rgba(255,255,255,.7); font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px; }

/* Job info / share capture */
.mit-info-capture { background: #1f2937; border-radius: 12px; }
.mit-info-heading { text-align: center; padding-bottom: 8px; margin: 0 0 10px; border-bottom: 1px solid #374151; color: #2dd4bf; font-weight: 700; font-size: 13px; letter-spacing: .03em; }
.mit-info-rows { display: flex; flex-direction: column; gap: 5px; font-size: 13px; margin-bottom: 10px; }
.mit-info-row { display: flex; gap: 6px; }
.mit-info-label { color: #6b7280; flex-shrink: 0; }
.mit-info-value { color: #e5e7eb; }
.mit-info-breakdown { padding-top: 8px; border-top: 1px solid #374151; display: flex; flex-direction: column; gap: 10px; }
.mit-info-breakdown-title { font-size: 12px; font-weight: 600; color: #9ca3af; margin: 0; }
.mit-info-group { display: flex; flex-direction: column; gap: 5px; border: 1px solid #374151; border-radius: 10px; padding: 8px 10px; background: rgba(17,24,39,.45); }
.mit-info-group-unassigned { border-color: rgba(217,119,6,.55); background: rgba(69,26,3,.35); }
.mit-info-group-pattern { border-color: rgba(20,184,166,.5); background: rgba(13,148,136,.14); }
.mit-info-group-title { font-size: 12px; font-weight: 600; color: #e5e7eb; margin: 0; }
.mit-info-sub { font-size: 11px; font-weight: 500; margin: 0; }
.mit-info-sub-mt { color: #2dd4bf; }
.mit-info-sub-kg { color: #f59e0b; }
.mit-info-chip-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px; }
@media (min-width: 420px) { .mit-info-chip-grid { grid-template-columns: repeat(5, minmax(0,1fr)); } }
.mit-info-chip { border-radius: 7px; padding: 3px 4px; font-size: 10px; font-weight: 500; border: 1px solid; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mit-info-chip-mt { color: #5eead4; background: rgba(13,148,136,.15); border-color: rgba(20,184,166,.5); }
.mit-info-chip-kg { color: #fcd34d; background: rgba(180,83,9,.15); border-color: rgba(245,158,11,.5); }
.mit-info-note { font-size: 11px; color: #9ca3af; margin: 0; }
.mit-info-group-total { font-size: 12px; font-weight: 500; color: #d1d5db; margin: 0; padding-top: 2px; }
.mit-info-grand-total { font-size: 14px; font-weight: 600; color: #f3f4f6; margin: 6px 0 0; padding-top: 6px; border-top: 1px solid #374151; }

/* Giriş satırının solundaki küçük top sayacı */
.mit-roll-count-badge {
  flex-shrink: 0; display: none; align-items: center; justify-content: center;
  min-width: 46px; height: 44px; padding: 0 8px; border-radius: 10px;
  background: rgba(31,41,55,.9); border: 1px solid #374151;
  font-size: 11px; font-weight: 600; color: #9ca3af; white-space: nowrap;
}

/* İş detayında iki ana bölüm çerçevesi */
.mit-section-frame {
  border-radius: 14px; border: 1px solid; padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.mit-section-unassigned { border-color: rgba(217,119,6,.55); background: rgba(69,26,3,.28); }
.mit-section-patterns { border-color: rgba(20,184,166,.5); background: rgba(13,148,136,.12); }
.mit-section-frame-title { margin: 0; font-size: 13px; font-weight: 600; color: #e5e7eb; }
.mit-section-unassigned .mit-section-frame-title { color: #fcd34d; }
.mit-section-patterns .mit-section-frame-title { color: #5eead4; }

/* Ayarlar kart ızgarası (yan yana 3 kutu) */
.mit-settings-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.mit-settings-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: 6px; padding: 14px 8px; min-height: 116px;
  background: #1f2937; border: 1px solid #374151; border-radius: 14px; color: inherit; text-align: center;
}
.mit-settings-tile:active { border-color: #14b8a6; }
.mit-settings-tile-icon {
  display: flex; align-items: center; justify-content: center;
  width: 42px; height: 42px; border-radius: 999px;
  background: rgba(13,148,136,.16); border: 1px solid rgba(20,184,166,.5); color: #5eead4;
}
.mit-settings-tile-title { font-size: 12px; font-weight: 600; color: #f3f4f6; line-height: 1.25; }
.mit-settings-tile-sub { font-size: 10px; color: #6b7280; line-height: 1.2; }

/* Hakkında ekranı */
.mit-about-header { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px 0 8px; gap: 4px; }
.mit-about-logo { width: 72px; height: 72px; object-fit: contain; margin-bottom: 6px; }
.mit-about-title { margin: 0; font-size: 20px; font-weight: 700; color: #f3f4f6; }
.mit-about-sub { margin: 0; font-size: 13px; color: #9ca3af; }
.mit-about-version { margin: 4px 0 0; font-size: 11px; color: #6b7280; }

</style>
</head>

/* ============ Yardımcılar ============ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtNum(n) {
  var r = Math.round(n * 100) / 100;
  return String(r).replace('.', ',');
}
function todayStr() {
  var d = new Date();
  return d.toISOString().slice(0, 10);
}
function fmtDate(iso) {
  var d = new Date(iso);
  return d.toLocaleDateString('tr-TR');
}

/* ============ localStorage ============ */
var LS_CUSTOMERS = 'mit_customers_v1';
var LS_PATTERNS = 'mit_patterns_v1';
var LS_REMINDER = 'mit_last_daily_backup_reminder_date_v1';

function loadCustomers() {
  try {
    var raw = localStorage.getItem(LS_CUSTOMERS);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveCustomers(customers) {
  try { localStorage.setItem(LS_CUSTOMERS, JSON.stringify(customers)); } catch (e) {}
}
function loadPatterns() {
  try {
    var raw = localStorage.getItem(LS_PATTERNS);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function savePatterns(patterns) {
  try { localStorage.setItem(LS_PATTERNS, JSON.stringify(patterns)); } catch (e) {}
}

/* ============ Kumaş hesaplama ============ */
function calcRollTotals(rolls, gramsPerMeter) {
  var mt = 0, kg = 0;
  rolls.forEach(function (r) {
    if (r.unit === 'mt') mt += r.value; else kg += r.value;
  });
  var eq = (gramsPerMeter && gramsPerMeter > 0) ? (kg * 1000) / gramsPerMeter : 0;
  return {
    meterRolls: rolls.filter(function (r) { return r.unit === 'mt'; }),
    kgRolls: rolls.filter(function (r) { return r.unit === 'kg'; }),
    totalMeters: mt,
    totalKg: kg,
    kgEquivalentMeters: eq,
    grandTotalMeters: mt + eq
  };
}
function jobAllRolls(job) {
  var all = job.unassignedRolls.slice();
  job.patternGroups.forEach(function (g) { all = all.concat(g.fabricRolls); });
  return all;
}
function calcJobTotals(job) {
  return calcRollTotals(jobAllRolls(job), job.fabricGramsPerMeter);
}
function jobDisplayName(job) {
  var names = job.patternGroups.map(function (g) { return (g.patternName || '').trim(); }).filter(Boolean);
  if (!names.length) return 'İsimsiz Kalıp';
  if (job.patternGroups.length === 1) return names[0] || 'İsimsiz Kalıp';
  return names[0] + ' +' + (job.patternGroups.length - 1) + ' diğer';
}

/* ============ Fabrika fonksiyonları ============ */
function emptyPatternGroup() {
  return { id: uid(), patternName: '', fabricRolls: [] };
}
function emptyJob() {
  var now = new Date().toISOString();
  return {
    id: uid(),
    createdAt: now,
    status: 'active',
    deliveredAt: null,
    patternGroups: [emptyPatternGroup()],
    unassignedRolls: [],
    photos: [],
    notes: '',
    fabricType: '',
    fabricColor: '',
    fabricGramsPerMeter: null
  };
}
function emptyCustomer() {
  var now = new Date().toISOString();
  return { id: uid(), name: '', phone: '', address: '', location: null, createdAt: now, updatedAt: now, jobs: [] };
}

/* ============ Görsel sıkıştırma ============ */
function compressImageFile(file, maxDim, quality) {
  maxDim = maxDim || 800;
  quality = quality || 0.7;
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('Dosya okunamadı')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('Görsel yüklenemedi')); };
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function compressImageFiles(files, maxDim, quality) {
  var list = Array.prototype.slice.call(files);
  var results = [];
  var p = Promise.resolve();
  list.forEach(function (f) {
    if (!f.type || f.type.indexOf('image/') !== 0) return;
    p = p.then(function () {
      return compressImageFile(f, maxDim, quality).then(function (r) { results.push(r); });
    }).catch(function (e) { console.error(e); });
  });
  return p.then(function () { return results; });
}

/* ============ Yedekleme ============ */
function buildBackup(customers) {
  return { appName: 'MIT', version: 1, exportedAt: new Date().toISOString(), customers: customers };
}
function mergeBackupCustomers(current, backupCustomers) {
  var result = current.map(function (c) { return Object.assign({}, c, { jobs: c.jobs.slice() }); });
  var indexById = {};
  result.forEach(function (c, i) { indexById[c.id] = i; });
  backupCustomers.forEach(function (bc) {
    var idx = indexById[bc.id];
    if (idx === undefined) {
      result.push(Object.assign({}, bc, { jobs: (bc.jobs || []).slice() }));
      return;
    }
    var existing = result[idx];
    var existingJobIds = {};
    existing.jobs.forEach(function (j) { existingJobIds[j.id] = true; });
    (bc.jobs || []).forEach(function (bj) {
      if (!existingJobIds[bj.id]) existing.jobs.push(bj);
    });
  });
  return result;
}
async function downloadAndShareBackup(customers) {
  var backup = buildBackup(customers);
  var json = JSON.stringify(backup, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url; link.download = 'mit-yedek.json';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  try {
    var file = new File([blob], 'mit-yedek.json', { type: 'application/json' });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'MİT Yedek Dosyası' });
    }
  } catch (e) { console.info('paylaşım iptal/desteklenmiyor', e); }
}
async function shareImageBlob(blob, filename) {
  try {
    var file = new File([blob], filename, { type: 'image/png' });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'İş Özeti' });
      return 'shared';
    }
  } catch (e) { console.info('paylaşım iptal/desteklenmiyor', e); }
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  return 'downloaded';
}

function periodStart(period) {
  var now = new Date();
  if (period === 'month') return new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
  var day = now.getDay();
  var diffToMonday = day === 0 ? 6 : day - 1;
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday, 0, 0, 0, 0);
}

var App = {
  root: null,
  view: 'home', // home | customers | customerDetail | settings | backup | patternLibrary
  customers: [],
  patterns: [],
  selectedCustomerId: null,
  splashPhase: 'start', // start | logo | done

  init: function () {
    this.root = document.getElementById('app-root');
    this.customers = loadCustomers();
    this.patterns = loadPatterns();
    this.render();
    this.setupKeyboardAutoScroll();

    var self = this;
    setTimeout(function () { self.splashPhase = 'logo'; self.render(); }, 3000);
    setTimeout(function () { self.splashPhase = 'done'; self.checkDailyReminder(); self.render(); }, 4000);
  },

  // Mobil sanal klavye açıldığında, odaklanılan alan klavyenin altında kalıp
  // görünmez olabiliyor. Bu, alanı yumuşak bir kaydırmayla ekranda görünür
  // hale getirir. İki tetikleyici birlikte kullanılıyor:
  // 1) focusin: odaklanma anında (klavye animasyonu için kısa gecikmeli)
  // 2) visualViewport resize: klavye GERÇEKTEN açıldığında (daha güvenilir,
  //    çünkü klavyenin ne zaman tam açıldığını tarayıcı bildiriyor)
  setupKeyboardAutoScroll: function () {
    function isTextInput(el) {
      if (!el) return false;
      var tag = el.tagName;
      if (tag !== 'INPUT' && tag !== 'TEXTAREA') return false;
      if (el.type === 'file' || el.type === 'checkbox' || el.type === 'radio') return false;
      return true;
    }
    function scrollToActive() {
      var el = document.activeElement;
      if (!isTextInput(el)) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    document.addEventListener('focusin', function (e) {
      if (!isTextInput(e.target)) return;
      // Klavye açılma animasyonu için kısa bir gecikme
      setTimeout(scrollToActive, 300);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        setTimeout(scrollToActive, 80);
      });
    }
  },

  persistCustomers: function () { saveCustomers(this.customers); },
  persistPatterns: function () { savePatterns(this.patterns); },

  findCustomer: function (id) {
    for (var i = 0; i < this.customers.length; i++) if (this.customers[i].id === id) return this.customers[i];
    return null;
  },

  checkDailyReminder: function () {
    var now = new Date();
    if (now.getHours() < 6) return;
    var last = null;
    try { last = localStorage.getItem(LS_REMINDER); } catch (e) {}
    if (last !== todayStr()) {
      Modals.showDailyReminder();
    }
  },
  dismissDailyReminder: function () {
    try { localStorage.setItem(LS_REMINDER, todayStr()); } catch (e) {}
  },

  setView: function (v) {
    this.view = v;
    this.render();
  },
  openCustomer: function (id) {
    this.selectedCustomerId = id;
    this.view = 'customerDetail';
    this.render();
  },

  render: function () {
    if (this.splashPhase !== 'done') {
      Screens.renderSplash(this.root, this.splashPhase);
      return;
    }
    var html = '<div class="mit-shell">';
    html += Screens.headerHtml(this.view);
    html += '<div class="mit-body" id="mit-body"></div>';
    html += Screens.bottomNavHtml(this.view);
    html += '</div>';
    this.root.innerHTML = html;

    var body = document.getElementById('mit-body');
    if (this.view === 'home') Screens.renderHome(body);
    else if (this.view === 'customers') Screens.renderCustomerList(body);
    else if (this.view === 'customerDetail') Screens.renderCustomerDetail(body);
    else if (this.view === 'settings') Screens.renderSettings(body);
    else if (this.view === 'backup') Screens.renderBackup(body);
    else if (this.view === 'about') Screens.renderAbout(body);
    else if (this.view === 'patternLibrary') Screens.renderPatternLibrary(body);

    Nav.wire(this.root);
    Toast.mountContainer();
  }
};

/* ============ Toast / Undo ============ */
var Toast = {
  items: [],
  undo: null,
  undoTimer: null,

  mountContainer: function () {
    if (document.getElementById('mit-toast-root')) return;
    var el = document.createElement('div');
    el.id = 'mit-toast-root';
    el.className = 'mit-toast-root';
    document.body.appendChild(el);
  },
  paint: function () {
    var el = document.getElementById('mit-toast-root');
    if (!el) return;
    var html = '';
    if (this.undo) {
      html += '<div class="mit-toast mit-toast-undo">' +
        '<span class="mit-toast-text">' + esc(this.undo.text) + '</span>' +
        '<button class="mit-toast-undo-btn" data-undo-click="1">' + icon('rotateCcw', 15) +
        ' Geri Al (' + this.undo.secondsLeft + ')</button></div>';
    }
    this.items.forEach(function (t) {
      var cls = t.type === 'error' ? 'mit-toast-error' : (t.type === 'info' ? 'mit-toast-info' : 'mit-toast-success');
      html += '<div class="mit-toast ' + cls + '">' + esc(t.text) + '</div>';
    });
    el.innerHTML = html;
    var btn = el.querySelector('[data-undo-click]');
    if (btn) {
      var self = this;
      btn.onclick = function () { self.runUndo(); };
    }
  },
  show: function (text, type) {
    var id = uid();
    this.items.push({ id: id, text: text, type: type || 'success' });
    this.paint();
    var self = this;
    setTimeout(function () {
      self.items = self.items.filter(function (t) { return t.id !== id; });
      self.paint();
    }, 3000);
  },
  showUndo: function (text, onUndo) {
    var self = this;
    if (this.undoTimer) clearInterval(this.undoTimer);
    this.undo = { text: text, onUndo: onUndo, secondsLeft: 5 };
    this.paint();
    this.undoTimer = setInterval(function () {
      if (!self.undo) { clearInterval(self.undoTimer); return; }
      self.undo.secondsLeft -= 1;
      if (self.undo.secondsLeft <= 0) {
        clearInterval(self.undoTimer);
        self.undo = null;
      }
      self.paint();
    }, 1000);
  },
  runUndo: function () {
    if (!this.undo) return;
    if (this.undoTimer) clearInterval(this.undoTimer);
    var fn = this.undo.onUndo;
    this.undo = null;
    this.paint();
    fn();
  }
};

var Confirm = {
  active: null,

  show: function (opts) {
    this.active = Object.assign({
      confirmLabel: 'Evet, Sil', cancelLabel: 'Vazgeç', danger: true, countdown: 0
    }, opts);
    this.paint();
  },
  hide: function () {
    if (this.active && this.active._timer) clearInterval(this.active._timer);
    this.active = null;
    var el = document.getElementById('mit-confirm-root');
    if (el) el.innerHTML = '';
  },
  paint: function () {
    var self = this;
    var el = document.getElementById('mit-confirm-root');
    if (!el) {
      el = document.createElement('div');
      el.id = 'mit-confirm-root';
      document.body.appendChild(el);
    }
    if (!this.active) { el.innerHTML = ''; return; }
    var a = this.active;
    var disabled = a.countdown > 0;
    el.innerHTML =
      '<div class="mit-modal-overlay" data-confirm-overlay="1">' +
      '<div class="mit-modal-sheet mit-confirm-sheet">' +
      '<div class="mit-confirm-top">' +
      '<div class="mit-confirm-icon">' + icon('alertTriangle', 20) + '</div>' +
      '<div><h3 class="mit-confirm-title">' + esc(a.title) + '</h3>' +
      '<p class="mit-confirm-msg">' + esc(a.message) + '</p></div></div>' +
      '<div class="mit-confirm-actions">' +
      '<button class="mit-btn mit-btn-secondary" data-confirm-cancel="1">' + esc(a.cancelLabel) + '</button>' +
      '<button class="mit-btn ' + (a.danger ? 'mit-btn-danger' : 'mit-btn-primary') + '" data-confirm-ok="1" ' +
      (disabled ? 'disabled' : '') + '>' +
      esc(a.confirmLabel) + (disabled ? ' (' + a.countdown + ')' : '') +
      '</button></div></div></div>';

    if (a.countdown > 0 && !a._timer) {
      a._timer = setInterval(function () {
        a.countdown -= 1;
        if (a.countdown <= 0) { clearInterval(a._timer); a._timer = null; }
        self.paint();
      }, 1000);
    }

    var overlay = el.querySelector('[data-confirm-overlay]');
    overlay.onclick = function (e) { if (e.target === overlay) self.hide(); };
    var cancelBtn = el.querySelector('[data-confirm-cancel]');
    cancelBtn.onclick = function () { self.hide(); };
    var okBtn = el.querySelector('[data-confirm-ok]');
    okBtn.onclick = function () {
      if (disabled) return;
      var fn = a.onConfirm;
      self.hide();
      fn && fn();
    };
  }
};

Screens._homeSearch = '';

Screens.renderHome = function (body) {
  var self = this;
  var period = this._homePeriod;
  var start = periodStart(period);
  var total = 0;
  var activeJobs = [];
  App.customers.forEach(function (c) {
    c.jobs.forEach(function (j) {
      if (j.status === 'active') activeJobs.push({ job: j, customer: c });
      if (new Date(j.createdAt) >= start) total += calcJobTotals(j).grandTotalMeters;
    });
  });
  activeJobs.sort(function (a, b) { return new Date(b.job.createdAt) - new Date(a.job.createdAt); });

  var q = this._homeSearch.trim().toLowerCase();
  var filtered = activeJobs;
  if (q) {
    filtered = activeJobs.filter(function (x) {
      return jobDisplayName(x.job).toLowerCase().indexOf(q) >= 0 ||
        x.customer.name.toLowerCase().indexOf(q) >= 0 ||
        (x.job.fabricType || '').toLowerCase().indexOf(q) >= 0 ||
        (x.job.fabricColor || '').toLowerCase().indexOf(q) >= 0 ||
        x.job.patternGroups.some(function (g) { return (g.patternName || '').toLowerCase().indexOf(q) >= 0; });
    });
  }

  var html = '<div class="mit-summary-card">' +
    '<div class="mit-summary-left">' +

Screens.jobCardHtml = function (job, customerName, customerId) {
  var totals = calcJobTotals(job);
  var badge = job.status === 'delivered'
    ? '<span class="mit-badge mit-badge-emerald">Teslim Edildi</span>'
    : '<span class="mit-badge mit-badge-amber">İmalatta</span>';
  var fabricLine = '';
  if (job.fabricType || job.fabricColor) {
    fabricLine = '<p class="mit-job-fabric">' + esc(job.fabricType || '') +
      (job.fabricType && job.fabricColor ? ' - ' : '') + esc(job.fabricColor || '') + '</p>';
  }
  var totalLine = totals.grandTotalMeters > 0
    ? '<p class="mit-job-total">Toplam: ' + fmtNum(totals.grandTotalMeters) + ' mt · ' + job.photos.length + ' fotoğraf</p>'
    : '';
  var showCustomerFirst = !!customerName;
  return '<div class="mit-card mit-job-card" data-job-open="1" data-customer-id="' + customerId + '" data-job-id="' + job.id + '">' +
    '<div class="mit-job-row">' +
    '<div class="mit-job-info-col">' +
    (showCustomerFirst ? '<p class="mit-job-customer mit-job-customer-top">' + esc(customerName) + '</p>' : '') +
    '<p class="mit-job-name">' + esc(jobDisplayName(job)) + '</p>' +
    (!showCustomerFirst && customerName ? '<p class="mit-job-customer">' + esc(customerName) + '</p>' : '') +
    fabricLine + '</div>' +
    '<div class="mit-job-side">' + badge +
    '<button class="mit-icon-btn mit-icon-sm mit-icon-accent" data-job-info="1" data-customer-id="' + customerId + '" data-job-id="' + job.id + '" aria-label="Özet">' + icon('info', 16) + '</button>' +
    '</div></div>' + totalLine + '</div>';
};

/* ============ Müşteri Listesi ============ */
Screens._custSearch = '';
Screens._custSort = 'alphabetical';
Screens._sortMenuOpen = false;

var SORT_LABELS = {
  alphabetical: 'Alfabetik',
  mostJobs: 'En Çok İş (Toplam)',
  dateAdded: 'Eklenme Tarihi',
  mostActiveJobs: 'En Çok Aktif İş',
  recentlyUpdated: 'En Son Güncellenen'
};

Screens.renderCustomerList = function (body) {
  var self = this;
  var q = this._custSearch.trim().toLowerCase();
  var list = App.customers.slice();
  if (q) {
    list = list.filter(function (c) {
      return c.name.toLowerCase().indexOf(q) >= 0 ||
        (c.phone || '').toLowerCase().indexOf(q) >= 0 ||
        (c.address || '').toLowerCase().indexOf(q) >= 0;
    });
  }
  var sort = this._custSort;
  list.sort(function (a, b) {
    if (sort === 'alphabetical') return a.name.localeCompare(b.name, 'tr');
    if (sort === 'mostJobs') return b.jobs.length - a.jobs.length;
    if (sort === 'dateAdded') return new Date(b.createdAt) - new Date(a.createdAt);
    if (sort === 'mostActiveJobs') {
      var av = a.jobs.filter(function (j) { return j.status === 'active'; }).length;
      var bv = b.jobs.filter(function (j) { return j.status === 'active'; }).length;
      return bv - av;
    }
    if (sort === 'recentlyUpdated') return new Date(b.updatedAt) - new Date(a.updatedAt);
    return 0;
  });

  var html = '<div class="mit-row-flex">' +
    '<div class="mit-search-wrap mit-flex-1"><span class="mit-search-icon">' + icon('search', 18) + '</span>' +
    '<input type="text" id="cust-search" class="mit-input mit-search-input" placeholder="İsim, telefon veya adres ara..." value="' + esc(this._custSearch) + '" /></div>' +
    '<div class="mit-sort-wrap">' +
    '<button class="mit-icon-btn mit-sort-btn" id="sort-toggle" aria-label="Sırala">' + icon('sort', 18) + '</button>' +
    (this._sortMenuOpen ? Screens.sortMenuHtml() : '') +
    '</div></div>';

  html += '<div class="mit-list">';
  if (!list.length) {
    html += '<p class="mit-empty">' + (App.customers.length === 0 ? 'Henüz müşteri eklenmedi' : 'Sonuç bulunamadı') + '</p>';
  } else {
    list.forEach(function (c) {
      var activeCount = c.jobs.filter(function (j) { return j.status === 'active'; }).length;
      html += '<button class="mit-card mit-customer-card" data-open-customer="' + c.id + '">' +
        '<div class="mit-customer-info"><p class="mit-customer-name">' + esc(c.name) + '</p>' +
        (c.address ? '<p class="mit-customer-address">' + esc(c.address) + '</p>' : '') + '</div>' +
        '<div class="mit-customer-stats"><span class="mit-badge mit-badge-amber">' + activeCount + ' Aktif</span>' +
        '<span class="mit-customer-total">' + c.jobs.length + ' Toplam İş</span></div></button>';
    });
  }
  html += '</div>';
  body.innerHTML = html;

  var searchInput = document.getElementById('cust-search');
  searchInput.oninput = function () {
    self._custSearch = searchInput.value;
    Screens.renderCustomerList(body);
    var ni = document.getElementById('cust-search');
    ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length);
  };
  document.getElementById('sort-toggle').onclick = function (e) {
    e.stopPropagation();
    self._sortMenuOpen = !self._sortMenuOpen;
    Screens.renderCustomerList(body);
  };
  Array.prototype.forEach.call(body.querySelectorAll('[data-sort-opt]'), function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      self._custSort = el.dataset.sortOpt;
      self._sortMenuOpen = false;
      Screens.renderCustomerList(body);
    };
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-open-customer]'), function (el) {
    el.onclick = function () { App.openCustomer(el.dataset.openCustomer); };
  });
  if (this._sortMenuOpen) {
    var closeHandler = function () { self._sortMenuOpen = false; Screens.renderCustomerList(body); document.removeEventListener('click', closeHandler); };
    setTimeout(function () { document.addEventListener('click', closeHandler); }, 0);
  }
};

Screens.sortMenuHtml = function () {
  var self = this;
  var html = '<div class="mit-sort-menu">';
  Object.keys(SORT_LABELS).forEach(function (k) {
    html += '<button class="mit-sort-item ' + (self._custSort === k ? 'mit-sort-item-active' : '') + '" data-sort-opt="' + k + '">' + SORT_LABELS[k] + '</button>';
  });
  html += '</div>';
  return html;
};

Screens._detailTab = 'active';

Screens.renderCustomerDetail = function (body) {
  var self = this;
  var c = App.findCustomer(App.selectedCustomerId);
  if (!c) { body.innerHTML = '<p class="mit-empty">Müşteri bulunamadı</p>'; return; }

  var activeJobs = c.jobs.filter(function (j) { return j.status === 'active'; });
  var deliveredJobs = c.jobs.filter(function (j) { return j.status === 'delivered'; });
  var visible = this._detailTab === 'active' ? activeJobs : deliveredJobs;

  var html = '';
  if (c.phone || c.address) {
    html += '<div class="mit-detail-contact">';
    if (c.phone) html += '<p class="mit-contact-line">' + icon('phone', 14) + ' ' + esc(c.phone) + '</p>';
    if (c.address) html += '<p class="mit-contact-line">' + icon('mapPin', 14) + ' ' + esc(c.address) + '</p>';
    html += '</div>';
  }

  html += '<div class="mit-tabs">' +
    '<button class="mit-tab ' + (this._detailTab === 'active' ? 'mit-tab-active-amber' : '') + '" data-detail-tab="active">İmalatta (' + activeJobs.length + ')</button>' +
    '<button class="mit-tab ' + (this._detailTab === 'delivered' ? 'mit-tab-active-emerald' : '') + '" data-detail-tab="delivered">Teslim Edildi (' + deliveredJobs.length + ')</button>' +
    '</div>';

  html += '<div class="mit-list">';
  if (!visible.length) {
    html += '<p class="mit-empty">' + (this._detailTab === 'active' ? 'Aktif iş bulunmuyor' : 'Teslim edilmiş iş bulunmuyor') + '</p>';
  } else {
    visible.forEach(function (j) {
      html += Screens.jobCardHtml(j, null, c.id).replace('data-job-open="1"', 'data-job-edit="1"');
    });
  }
  html += '</div>';

  html += '<button class="mit-fab" id="add-job-btn" aria-label="Yeni İş Ekle">' + icon('plus', 26) + '</button>';

  body.innerHTML = html;

  Array.prototype.forEach.call(body.querySelectorAll('[data-detail-tab]'), function (el) {
    el.onclick = function () { self._detailTab = el.dataset.detailTab; Screens.renderCustomerDetail(body); };
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-job-edit]'), function (el) {
    el.onclick = function () {
      var j = null;
      c.jobs.forEach(function (jj) { if (jj.id === el.dataset.jobId) j = jj; });
      Modals.showJobForm(c, j);
    };
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-job-info]'), function (el) {
    el.onclick = function (e) {
      e.stopPropagation();
      var j = null;
      c.jobs.forEach(function (jj) { if (jj.id === el.dataset.jobId) j = jj; });
      Modals.showJobInfo(c, j);
    };
  });
  document.getElementById('add-job-btn').onclick = function () { Modals.showJobForm(c, null); };
};

var Nav = {
  wire: function (root) {
    var backBtn = root.querySelector('[data-nav-back]');
    if (backBtn) backBtn.onclick = function () {
      if (App.view === 'patternLibrary' || App.view === 'backup' || App.view === 'about') App.setView('settings');
      else { App.selectedCustomerId = null; App.setView('customers'); }
    };
    Array.prototype.forEach.call(root.querySelectorAll('[data-nav-tab]'), function (el) {
      el.onclick = function () {
        var v = el.dataset.navTab;
        if (v === 'customers' && App.view === 'customerDetail') App.selectedCustomerId = null;
        App.setView(v);
      };
    });
    var addCustomerBtn = root.querySelector('[data-open-add-customer]');
    if (addCustomerBtn) addCustomerBtn.onclick = function () { Modals.showCustomerForm(null); };

    var editBtn = root.querySelector('[data-customer-edit]');
    if (editBtn) editBtn.onclick = function () { Modals.showCustomerForm(App.findCustomer(App.selectedCustomerId)); };
    var delBtn = root.querySelector('[data-customer-delete]');
    if (delBtn) delBtn.onclick = function () { Modals.confirmDeleteCustomer(App.findCustomer(App.selectedCustomerId)); };
  }
};

Screens.renderBackup = function (body) {
  var totalJobs = App.customers.reduce(function (s, c) { return s + c.jobs.length; }, 0);
  var html = '<div class="mit-card mit-settings-stat"><p class="mit-muted-sm">' +
    App.customers.length + ' müşteri · ' + totalJobs + ' iş kayıtlı</p></div>';

  html += '<div class="mit-card mit-settings-block">' +
    '<h3 class="mit-block-title">Yedek Alma</h3>' +
    '<p class="mit-block-desc">Yedekleme her seferinde aynı dosyanın üzerine yazılır. İndirme sırasında paylaşım penceresi de açılır (destekleniyorsa).</p>' +
    '<button class="mit-btn mit-btn-primary mit-btn-block" id="export-btn">' + icon('download', 20) + ' Yedekle</button>' +
    '</div>';

  html += '<div class="mit-card mit-settings-block">' +
    '<h3 class="mit-block-title">Yedek Geri Yükleme</h3>' +
    '<p class="mit-block-desc">' + icon('info', 14) + ' İçe aktarma sadece eksik kayıtları tamamlar; mevcut verinize hiçbir zaman dokunulmaz veya silinmez.</p>' +
    '<button class="mit-btn mit-btn-secondary mit-btn-block" id="import-btn">' + icon('upload', 20) + ' Yedek Dosyası Seç</button>' +
    '<input type="file" id="import-file" accept="application/json" class="mit-hidden" />' +
    '</div>';

  body.innerHTML = html;

  document.getElementById('export-btn').onclick = async function (e) {
    var btn = e.currentTarget;
    btn.disabled = true;
    btn.innerHTML = icon('loader', 20, 'mit-spin') + ' Hazırlanıyor...';
    try {
      await downloadAndShareBackup(App.customers);
      Toast.show('Yedek dosyası indirildi');
    } catch (err) {
      console.error(err);
      Toast.show('Yedekleme sırasında hata oluştu', 'error');
    }
    Screens.renderBackup(body);
  };

  document.getElementById('import-btn').onclick = function () { document.getElementById('import-file').click(); };
  document.getElementById('import-file').onchange = function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.customers)) throw new Error('format');
        App.customers = mergeBackupCustomers(App.customers, parsed.customers);
        App.persistCustomers();
        Toast.show('Yedek başarıyla içe aktarıldı');
      } catch (err) {
        console.error(err);
        Toast.show('Dosya okunamadı veya geçersiz format', 'error');
      }
      Screens.renderBackup(body);
    };
    reader.readAsText(file);
  };
};

Screens._patLibDraftName = '';
Screens._patLibDraftPhoto = null;
Screens._patLibEditingId = null;

Screens.renderPatternLibrary = function (body) {
  var self = this;
  var editing = !!this._patLibEditingId;
  var sorted = App.patterns.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'tr'); });

  var html = '<div class="mit-card mit-settings-block">' +
    '<h3 class="mit-block-title">' + icon('tag', 16, 'mit-accent') + ' ' + (editing ? 'Kalıbı Düzenle' : 'Yeni Kalıp Ekle') + '</h3>' +
    '<div class="mit-pattern-form-row">' +
    '<button class="mit-photo-pick" id="pat-photo-btn" aria-label="Fotoğraf seç">' +
    (this._patLibDraftPhoto
      ? '<img src="' + this._patLibDraftPhoto + '" alt="" />'
      : icon('image', 22, 'mit-muted')) +
    '</button>' +
    '<div class="mit-pattern-form-fields">' +
    '<input type="text" id="pat-name-input" class="mit-input" placeholder="Kalıp adı..." value="' + esc(this._patLibDraftName) + '" />' +
    '<div class="mit-pattern-form-btns">' +
    '<button class="mit-btn mit-btn-secondary mit-btn-sm" id="pat-camera-btn">' + icon('camera', 14) + ' Kamera</button>' +
    '<button class="mit-btn mit-btn-secondary mit-btn-sm" id="pat-gallery-btn">' + icon('image', 14) + ' Galeri</button>' +
    '</div></div></div>' +
    '<input type="file" id="pat-camera-input" accept="image/*" capture="environment" class="mit-hidden" />' +
    '<input type="file" id="pat-gallery-input" accept="image/*" class="mit-hidden" />' +
    '<div class="mit-pattern-form-actions">' +
    (editing ? '<button class="mit-btn mit-btn-secondary" id="pat-cancel-btn">Vazgeç</button>' : '') +
    '<button class="mit-btn mit-btn-primary mit-btn-flex1" id="pat-submit-btn">' +
    icon(editing ? 'edit' : 'plus', 18) + (editing ? ' Kaydet' : ' Kalıbı Ekle') + '</button>' +
    '</div></div>';

  html += '<p class="mit-muted-sm mit-section-label">Kayıtlı Kalıplar (' + App.patterns.length + ')</p>';
  if (!sorted.length) {
    html += '<p class="mit-empty">Henüz kalıp eklenmedi</p>';
  } else {
    html += '<div class="mit-pattern-grid">';
    sorted.forEach(function (p) {
      html += '<div class="mit-pattern-tile">' +
        '<div class="mit-pattern-tile-img">' + (p.photo ? '<img src="' + p.photo + '" alt="" />' : icon('tag', 22, 'mit-muted')) + '</div>' +
        '<p class="mit-pattern-tile-name">' + esc(p.name) + '</p>' +
        '<button class="mit-tile-action mit-tile-action-left" data-pat-edit="' + p.id + '" aria-label="Düzenle">' + icon('edit', 13) + '</button>' +
        '<button class="mit-tile-action mit-tile-action-right" data-pat-delete="' + p.id + '" aria-label="Sil">' + icon('x', 14) + '</button>' +
        '</div>';
    });
    html += '</div>';
  }

  body.innerHTML = html;

  var photoBtn = document.getElementById('pat-photo-btn');
  var camInput = document.getElementById('pat-camera-input');
  var galInput = document.getElementById('pat-gallery-input');
  photoBtn.onclick = function () { galInput.click(); };
  document.getElementById('pat-camera-btn').onclick = function () { camInput.click(); };
  document.getElementById('pat-gallery-btn').onclick = function () { galInput.click(); };

  function handlePhoto(input) {
    input.onchange = function () {
      var file = input.files && input.files[0];
      if (!file) return;
      compressImageFile(file, 600, 0.75).then(function (dataUri) {
        self._patLibDraftPhoto = dataUri;
        Screens.renderPatternLibrary(body);
      });
    };
  }
  handlePhoto(camInput);
  handlePhoto(galInput);

  var nameInput = document.getElementById('pat-name-input');
  nameInput.oninput = function () { self._patLibDraftName = nameInput.value; };
  nameInput.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } };

  function submit() {
    var trimmed = self._patLibDraftName.trim();
    if (!trimmed) { Toast.show('Kalıp adı girmelisin', 'error'); return; }
    var dup = App.patterns.some(function (p) {
      return p.id !== self._patLibEditingId && p.name.toLowerCase() === trimmed.toLowerCase();
    });
    if (dup) { Toast.show('Bu kalıp zaten kayıtlı', 'error'); return; }
    if (self._patLibEditingId) {
      App.patterns = App.patterns.map(function (p) {
        return p.id === self._patLibEditingId ? Object.assign({}, p, { name: trimmed, photo: self._patLibDraftPhoto }) : p;
      });
      Toast.show('Kalıp güncellendi');
    } else {
      App.patterns.push({ id: uid(), name: trimmed, photo: self._patLibDraftPhoto });
    }
    App.persistPatterns();
    self._patLibEditingId = null;
    self._patLibDraftName = '';
    self._patLibDraftPhoto = null;
    Screens.renderPatternLibrary(body);
  }
  document.getElementById('pat-submit-btn').onclick = submit;
  var cancelBtn = document.getElementById('pat-cancel-btn');
  if (cancelBtn) cancelBtn.onclick = function () {
    self._patLibEditingId = null; self._patLibDraftName = ''; self._patLibDraftPhoto = null;
    Screens.renderPatternLibrary(body);
  };

  Array.prototype.forEach.call(body.querySelectorAll('[data-pat-edit]'), function (el) {
    el.onclick = function () {
      var p = App.patterns.filter(function (x) { return x.id === el.dataset.patEdit; })[0];
      if (!p) return;
      self._patLibEditingId = p.id;
      self._patLibDraftName = p.name;
      self._patLibDraftPhoto = p.photo || null;
      Screens.renderPatternLibrary(body);
      window.scrollTo(0, 0);
    };
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-pat-delete]'), function (el) {
    el.onclick = function () {
      var id = el.dataset.patDelete;
      Confirm.show({
        title: 'Kalıp Silinsin mi?',
        message: 'Bu kalıp kütüphaneden kalıcı olarak silinecek.',
        onConfirm: function () {
          App.patterns = App.patterns.filter(function (p) { return p.id !== id; });
          App.persistPatterns();
          Screens.renderPatternLibrary(body);
        }
      });
    };
  });
};

var Modals = {};

/* ============ Genel modal iskeleti ============ */
Modals._stack = [];

Modals.openSheet = function (id, contentHtml, opts) {
  opts = opts || {};
  var el = document.createElement('div');
  el.className = 'mit-modal-overlay';
  el.id = id;
  el.innerHTML = '<div class="mit-modal-sheet' + (opts.wide ? ' mit-modal-wide' : '') + '">' + contentHtml + '</div>';
  document.body.appendChild(el);
  if (!opts.persistent) {
    el.onclick = function (e) { if (e.target === el) Modals.closeSheet(id); };
  }
  return el;
};
Modals.closeSheet = function (id) {
  var el = document.getElementById(id);
  if (el) el.parentNode.removeChild(el);
};

/* ============ Müşteri Formu ============ */
Modals.showCustomerForm = function (customer) {
  var isNew = !customer;
  var draft = customer ? Object.assign({}, customer) : emptyCustomer();
  var nameTouched = false;
  var locating = false;
  var id = 'modal-customer-form';

  function paint() {
    var nameEmpty = draft.name.trim() === '';
    var html = '<div class="mit-modal-header"><h3>' + (isNew ? 'Yeni Müşteri' : 'Müşteriyi Düzenle') + '</h3>' +
      '<button class="mit-icon-btn" data-close="1">' + icon('x', 22) + '</button></div>' +
      '<div class="mit-modal-content">' +
      '<div class="mit-field">' +
      '<label class="mit-label">Müşteri / Firma Adı <span class="mit-required">*</span></label>' +
      '<input type="text" id="cf-name" class="mit-input ' + (nameTouched && nameEmpty ? 'mit-field-empty' : '') + '" value="' + esc(draft.name) + '" placeholder="Örn: Ahmet Tekstil" />' +
      (nameTouched && nameEmpty ? '<p class="mit-field-error">Müşteri adı zorunludur</p>' : '') +
      '</div>' +
      '<div class="mit-field">' +
      '<label class="mit-label">Telefon</label>' +
      '<input type="tel" id="cf-phone" class="mit-input ' + (draft.phone ? '' : 'mit-field-empty') + '" value="' + esc(draft.phone) + '" placeholder="Örn: 0532 000 00 00" />' +
      '</div>' +
      '<div class="mit-field">' +
      '<label class="mit-label">Adres</label>' +
      '<textarea id="cf-address" rows="2" class="mit-input mit-textarea ' + (draft.address ? '' : 'mit-field-empty') + '" placeholder="Açık adres">' + esc(draft.address) + '</textarea>' +
      '</div>' +
      '<button class="mit-btn mit-btn-secondary mit-btn-block" id="cf-gps">' +
      (locating ? icon('loader', 18, 'mit-spin') : (draft.location ? icon('checkCircle', 18, 'mit-emerald') : icon('mapPin', 18))) +
      ' ' + (draft.location ? 'Konum Alındı (Güncellemek İçin Tıkla)' : 'Mevcut Konumumu Al') +
      '</button>' +
      '</div>' +
      '<div class="mit-modal-footer"><button class="mit-btn mit-btn-primary mit-btn-block" id="cf-save">Kaydet</button></div>';

    var el = document.getElementById(id);
    if (!el) el = Modals.openSheet(id, html);
    else el.querySelector('.mit-modal-sheet').innerHTML = html;
    wire();
  }

  function wire() {
    var el = document.getElementById(id);
    el.querySelector('[data-close]').onclick = function () { Modals.closeSheet(id); };
    var nameInput = document.getElementById('cf-name');
    nameInput.oninput = function () {
      draft.name = nameInput.value;
      if (nameTouched) {
        var stillEmpty = draft.name.trim() === '';
        nameInput.classList.toggle('mit-field-empty', stillEmpty);
        var err = document.getElementById('cf-name-error');
        if (!stillEmpty && err) err.parentNode.removeChild(err);
      }
    };
    nameInput.onblur = function () {
      nameTouched = true;
      var nowEmpty = draft.name.trim() === '';
      nameInput.classList.toggle('mit-field-empty', nowEmpty);
      var existingError = document.getElementById('cf-name-error');
      if (nowEmpty && !existingError) {
        var err = document.createElement('p');
        err.id = 'cf-name-error';
        err.className = 'mit-field-error';
        err.textContent = 'Müşteri adı zorunludur';
        nameInput.parentNode.appendChild(err);
      } else if (!nowEmpty && existingError) {
        existingError.parentNode.removeChild(existingError);
      }
    };
    var phoneInput = document.getElementById('cf-phone');
    phoneInput.oninput = function (e) {
      draft.phone = e.target.value;
      phoneInput.classList.toggle('mit-field-empty', !draft.phone);
    };
    var addressInput = document.getElementById('cf-address');
    addressInput.oninput = function (e) {
      draft.address = e.target.value;
      addressInput.classList.toggle('mit-field-empty', !draft.address);
    };
    document.getElementById('cf-gps').onclick = function () {
      if (!navigator.geolocation) { Toast.show('Cihazınız konum özelliğini desteklemiyor', 'error'); return; }
      locating = true; paint();
      navigator.geolocation.getCurrentPosition(function (pos) {
        draft.location = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        locating = false; paint();
        Toast.show('Konum alındı');
      }, function (err) {
        console.error(err); locating = false; paint();
        Toast.show('Konum alınamadı', 'error');
      }, { enableHighAccuracy: true, timeout: 10000 });
    };
    document.getElementById('cf-save').onclick = function () {
      if (draft.name.trim() === '') { nameTouched = true; paint(); return; }
      draft.name = draft.name.trim();
      draft.updatedAt = new Date().toISOString();
      if (isNew) {
        App.customers.push(draft);
        App.persistCustomers();
        Modals.closeSheet(id);
        App.openCustomer(draft.id);
      } else {
        App.customers = App.customers.map(function (c) { return c.id === draft.id ? draft : c; });
        App.persistCustomers();
        Modals.closeSheet(id);
        App.render();
      }
    };
  }
  paint();
};

/* ============ Kumaş Topu Motoru ============
   ÖNEMLİ: Giriş kutusu (input) bir kez oluşturulur ve ASLA yeniden
   yaratılmaz. Top eklendiğinde sadece liste ve toplamlar güncellenir.
   Böylece Android'de klavye kapanmaz ve imleç kutuda kalır. */

function createFabricRollController(getRolls, setRolls, getGramsPerMeter) {
  var ctx = {
    unit: 'mt',
    editingId: null,
    afterRender: null,
    containerId: null
  };

  function totals() {
    return calcRollTotals(getRolls(), getGramsPerMeter());
  }

  /* Sabit iskelet: birim seçici + giriş satırı + dinamik alan */
  function buildSkeleton(containerId) {
    var container = document.getElementById(containerId);
    container.innerHTML =
      '<div class="mit-roll-unit-row">' +
      '<button class="mit-unit-btn" data-roll-unit="mt">Metre (mt)</button>' +
      '<button class="mit-unit-btn" data-roll-unit="kg">Kilo (kg)</button>' +
      '</div>' +
      '<div class="mit-roll-input-row">' +
      '<span class="mit-roll-count-badge" data-roll-count></span>' +
      '<input type="number" inputmode="decimal" step="any" enterkeyhint="done" ' +
      'class="mit-input mit-roll-input" data-roll-num-input="1" />' +
      '<button class="mit-btn mit-btn-primary mit-roll-add-btn" data-roll-commit="1" aria-label="Topu ekle">' + icon('plus', 22) + '</button>' +
      '</div>' +
      '<div data-roll-dynamic></div>';

    var input = container.querySelector('[data-roll-num-input]');

    function commit() {
      var num = parseFloat(String(input.value).replace(',', '.'));
      input.value = '';
      if (!isFinite(num) || num <= 0) return;
      setRolls(getRolls().concat([{ id: uid(), value: num, unit: ctx.unit }]));
      renderDynamic();          // input'a DOKUNMAZ
      if (ctx.afterRender) ctx.afterRender();
    }

    // Android numaratöründe sağ alt tuş çoğu cihazda Enter yerine Tab gönderir.
    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== 'Tab') return;
      e.preventDefault();       // odak sonraki alana atlamasın
      commit();
      // input aynı DOM düğümü olduğu için klavye açık kalır, imleç yerinde kalır
    });

    container.querySelector('[data-roll-commit]').addEventListener('click', function (e) {
      e.preventDefault();
      commit();
      input.focus();
    });

    Array.prototype.forEach.call(container.querySelectorAll('[data-roll-unit]'), function (b) {
      b.addEventListener('click', function () {
        ctx.unit = b.dataset.rollUnit;
        paintUnitRow(containerId);
        renderDynamic();
        input.focus();
        if (ctx.afterRender) ctx.afterRender();
      });
    });
  }

  function paintUnitRow(containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;
    var input = container.querySelector('[data-roll-num-input]');
    input.placeholder = ctx.unit === 'mt' ? 'Metre gir ve ekle' : 'Kilo gir ve ekle';
    Array.prototype.forEach.call(container.querySelectorAll('[data-roll-unit]'), function (b) {
      var on = b.dataset.rollUnit === ctx.unit;
      b.classList.remove('mit-unit-mt-active', 'mit-unit-kg-active');
      if (on) b.classList.add(ctx.unit === 'mt' ? 'mit-unit-mt-active' : 'mit-unit-kg-active');
    });
    // Sol baştaki küçük sayaç: seçili birimde kaç top eklendi
    var t = totals();
    var count = ctx.unit === 'mt' ? t.meterRolls.length : t.kgRolls.length;
    var badge = container.querySelector('[data-roll-count]');
    badge.textContent = count > 0 ? (count + ' top') : '';
    badge.style.display = count > 0 ? 'flex' : 'none';
  }

  /* Sadece listeler + toplamlar yeniden çizilir; giriş kutusu korunur */
  function renderDynamic() {
    var container = document.getElementById(ctx.containerId);
    if (!container) return;
    var t = totals();
    var html = '';

    if (t.meterRolls.length) {
      html += '<p class="mit-roll-group-label">Metre Topları (' + t.meterRolls.length + ')</p>' +
        '<div class="mit-roll-grid">' + t.meterRolls.map(rollChipHtml).join('') + '</div>';
    }
    if (t.kgRolls.length) {
      html += '<p class="mit-roll-group-label">Kilo Topları (' + t.kgRolls.length + ')</p>' +
        '<div class="mit-roll-grid">' + t.kgRolls.map(rollChipHtml).join('') + '</div>';
    }

    html += '<div class="mit-roll-totals">' +
      '<div class="mit-roll-total-row"><span>Toplam Metre</span><span class="mit-roll-total-mt">' + fmtNum(t.totalMeters) + ' mt</span></div>' +
      '<div class="mit-roll-total-row"><span>Toplam Kilo</span><span class="mit-roll-total-kg">' + fmtNum(t.totalKg) +
      ' kg' + (t.kgEquivalentMeters > 0 ? ' (≈ ' + fmtNum(t.kgEquivalentMeters) + ' mt)' : '') + '</span></div>' +
      '<div class="mit-roll-total-row mit-roll-total-grand"><span>Genel Toplam</span><span>' + fmtNum(t.grandTotalMeters) + ' mt</span></div>' +
      '</div>';

    container.querySelector('[data-roll-dynamic]').innerHTML = html;
    paintUnitRow(ctx.containerId);
    wireChips(container);
  }

  function rollChipHtml(r) {
    var cls = r.unit === 'mt' ? 'mit-chip-mt' : 'mit-chip-kg';
    if (ctx.editingId === r.id) {
      return '<div class="mit-roll-chip ' + cls + ' mit-roll-chip-editing">' +
        '<input type="number" inputmode="decimal" class="mit-chip-edit-input" value="' + r.value + '" data-roll-edit-input="' + r.id + '" /></div>';
    }
    return '<div class="mit-roll-chip ' + cls + '" data-roll-chip="' + r.id + '">' +
      '<span>' + r.value + ' ' + r.unit + '</span>' +
      '<button class="mit-chip-x" data-roll-delete="' + r.id + '" aria-label="Sil">' + icon('x', 14) + '</button></div>';
  }

  function wireChips(container) {
    Array.prototype.forEach.call(container.querySelectorAll('[data-roll-delete]'), function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var rollId = b.dataset.rollDelete;
        var removed = getRolls().filter(function (r) { return r.id === rollId; })[0];
        Confirm.show({
          title: 'Top Silinsin mi?',
          message: 'Bu kumaş topu bilgisini silmek istediğine emin misin? Bu işlem geri alınamaz.',
          onConfirm: function () {
            setRolls(getRolls().filter(function (r) { return r.id !== rollId; }));
            renderDynamic();
            if (ctx.afterRender) ctx.afterRender();
            if (removed) {
              Toast.showUndo(removed.value + ' ' + removed.unit + ' top silindi', function () {
                setRolls(getRolls().concat([removed]));
                renderDynamic();
                if (ctx.afterRender) ctx.afterRender();
              });
            }
          }
        });
      };
    });

    // Düzenleme kutusu aktifse bağla
    var editInput = container.querySelector('[data-roll-edit-input]');
    if (editInput) {
      editInput.focus();
      editInput.select();
      var save = function () {
        var num = parseFloat(String(editInput.value).replace(',', '.'));
        if (isFinite(num) && num > 0) {
          setRolls(getRolls().map(function (r) { return r.id === ctx.editingId ? Object.assign({}, r, { value: num }) : r; }));
        }
        ctx.editingId = null;
        renderDynamic();
        if (ctx.afterRender) ctx.afterRender();
      };
      editInput.onblur = save;
      editInput.onkeydown = function (e) { if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); save(); } };
    }

    // 2 saniye basılı tutunca düzenleme moduna geç
    Array.prototype.forEach.call(container.querySelectorAll('[data-roll-chip]'), function (chip) {
      var timer = null, sx = 0, sy = 0;
      function start(x, y) {
        sx = x; sy = y;
        timer = setTimeout(function () {
          ctx.editingId = chip.dataset.rollChip;
          renderDynamic();
        }, 2000);
      }
      function clear() { if (timer) { clearTimeout(timer); timer = null; } }
      chip.addEventListener('touchstart', function (e) { start(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      chip.addEventListener('touchmove', function (e) {
        if (Math.abs(e.touches[0].clientX - sx) > 12 || Math.abs(e.touches[0].clientY - sy) > 12) clear();
      }, { passive: true });
      chip.addEventListener('touchend', clear);
      chip.addEventListener('mousedown', function (e) { start(e.clientX, e.clientY); });
      chip.addEventListener('mouseup', clear);
      chip.addEventListener('mouseleave', clear);
    });
  }

  function renderInto(containerId, afterRender) {
    if (afterRender) ctx.afterRender = afterRender;
    ctx.containerId = containerId;
    var container = document.getElementById(containerId);
    if (!container) return;
    // İskelet yoksa (ilk çizim ya da modal yeniden çizildi) kur
    if (!container.querySelector('[data-roll-num-input]')) {
      buildSkeleton(containerId);
    }
    paintUnitRow(containerId);
    renderDynamic();
    if (ctx.afterRender) ctx.afterRender();
  }

  return { renderInto: renderInto, renderDynamic: renderDynamic };
}
